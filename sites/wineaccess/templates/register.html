{% extends "base.html" %}
{% block title %}Register - Wine Access{% endblock %}
{% block content %}
<section class="auth-panel">
  <h1>Create a Wine Access account</h1>
  <form method="post" class="form-card">
    <label>Name <input name="display_name" required placeholder="Jordan Rivera"></label>
    <label>Email <input type="email" name="email" required placeholder="jordan@test.com"></label>
    <label>Password <input type="password" name="password" required minlength="8"></label>
    <button type="submit">Create Account</button>
  </form>
</section>
{% endblock %}
