{% extends "base.html" %}
{% block title %}Saved Cellar - Wine Access{% endblock %}
{% block content %}
<section class="grid-section">
  <h1>Saved Cellar</h1>
  <div class="wine-grid">
    {% for item in items %}
      {% set wine = item.wine %}
      {% include "_wine_card.html" %}
    {% else %}
      <p>No saved wines yet.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
