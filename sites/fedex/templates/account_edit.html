{% extends "base.html" %}
{% block title %}Edit Account{% endblock %}
{% block content %}
  <section class="card">
    <div class="kicker">Profile</div>
    <h1>Edit local account details</h1>
    <form method="post" class="stack">
      <div class="form-grid two">
        <div class="field"><label for="first_name">First name</label><input id="first_name" name="first_name" value="{{ current_user.first_name }}"></div>
        <div class="field"><label for="last_name">Last name</label><input id="last_name" name="last_name" value="{{ current_user.last_name }}"></div>
      </div>
      <div class="form-grid two">
        <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" value="{{ current_user.phone }}"></div>
        <div class="field"><label for="company">Company</label><input id="company" name="company" value="{{ current_user.company }}"></div>
      </div>
      <div class="form-grid three">
        <div class="field"><label for="city">City</label><input id="city" name="city" value="{{ current_user.city }}"></div>
        <div class="field"><label for="state">State</label><input id="state" name="state" value="{{ current_user.state }}"></div>
        <div class="field"><label for="zip_code">ZIP code</label><input id="zip_code" name="zip_code" value="{{ current_user.zip_code }}"></div>
      </div>
      <div class="form-grid two">
        <div class="field"><label for="preferred_location_slug">Preferred location slug</label><input id="preferred_location_slug" name="preferred_location_slug" value="{{ current_user.preferred_location_slug }}"></div>
        <div class="field"><label for="invoicing_email">Invoicing email</label><input id="invoicing_email" name="invoicing_email" value="{{ current_user.invoicing_email }}"></div>
      </div>
      <input type="submit" value="Save profile">
    </form>
  </section>
{% endblock %}
