{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="auth-shell">
  <section class="auth-card">
    <h1>Create Account</h1>
    <p class="auth-sub">Create a free Cboe mirror account to build a watchlist, register for Options Institute classes, and save insights.</p>
    <form method="post" class="auth-form">
      <label>Display Name
        <input type="text" name="display_name" required placeholder="Jordan Rivers">
      </label>
      <label>Username
        <input type="text" name="username" required placeholder="jordan_r" pattern="[a-z0-9_]+">
      </label>
      <label>Email
        <input type="email" name="email" required autocomplete="email" placeholder="you@test.com">
      </label>
      <label>Password
        <input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
      </label>
      <button class="btn-solid wide" type="submit">Create Account</button>
    </form>
    <p class="auth-alt">Already have an account? <a href="/account/login">Sign in</a>.</p>
  </section>
</div>
{% endblock %}
