{% extends "base.html" %}
{% block title %}Sign In : Micro Center{% endblock %}
{% block content %}
<div class="shell">
  <div class="form-card">
    <h1>Sign In</h1>
    <p class="small muted">Sign in to your Micro Center Insider account to see your orders, lists, and saved payment methods.</p>
    <form method="POST" action="/account/signin">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-row">
        <label>Email address <span class="req">*</span></label>
        <input type="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-row">
        <label>Password <span class="req">*</span></label>
        <input type="password" name="password" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">Sign In</button>
    </form>
    <p class="auth-alt">New to Micro Center? <a href="/account/register">Create an account</a></p>
  </div>
</div>
{% endblock %}
