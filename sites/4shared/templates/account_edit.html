{% extends 'base.html' %}{% block title %}Account settings — 4shared{% endblock %}{% block content %}<section class="page"><div class="container"><h1 class="page-title">Account settings</h1><p class="page-lede">Keep your public profile information up to date.</p><div class="account-layout">{% include '_account_nav.html' %}<div class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-group"><label>Email</label><input value="{{ current_user.email }}" disabled></div><div class="form-group"><label for="display_name">Display name</label><input id="display_name" name="display_name" value="{{ current_user.display_name }}" required></div><div class="form-group"><label for="location">Location</label><input id="location" name="location" value="{{ current_user.location }}"></div><div class="form-group"><label for="bio">About you</label><textarea id="bio" name="bio">{{ current_user.bio }}</textarea></div><button class="primary-button">Save changes</button></form></div></div></div></section>{% endblock %}
