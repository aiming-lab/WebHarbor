{% extends 'base.html' %}{% block title %}Sign up — 4shared{% endblock %}{% block content %}<section class="page"><div class="container"><div class="auth-shell"><div class="panel"><h1>Get 15 GB free</h1><p class="page-lede center">Create an account to upload, organize, and share files.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-group"><label for="display_name">Your name</label><input id="display_name" name="display_name" required maxlength="120"></div><div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required><div class="form-hint">At least 8 characters.</div></div><button class="primary-button wide">Create account</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></div></div></section>{% endblock %}
