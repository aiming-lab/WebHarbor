{% extends 'base.html' %}{% block title %}Preview {{ file.filename }} — 4shared{% endblock %}{% block content %}<section class="page"><div class="container"><p class="breadcrumb"><a href="{{ url_for('file_detail',slug=file.slug) }}">← Back to file details</a></p><h1 class="page-title">Preview: {{ file.filename }}</h1><div class="panel preview-panel">{% if file.thumbnail %}<img src="{{ url_for('static',filename=file.thumbnail) }}" alt="{{ file.stem }}">{% else %}<div class="center"><span class="file-icon" style="margin:auto">{{ file.extension }}</span><p class="preview-note" style="margin-top:35px">{{ file.preview_text }}</p></div>{% endif %}</div></div></section>{% endblock %}
