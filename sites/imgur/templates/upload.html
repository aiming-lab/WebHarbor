{% extends "base.html" %}
{% block title %}Image Upload &amp; Meme Generation | Imgur{% endblock %}
{% block body %}
<div class="uploadpage">
  <form method="post" action="/upload" enctype="multipart/form-data" id="uploadform">
    <div class="uploadcard">
      <button class="close" type="button" onclick="location.href='/'" aria-label="Close">✕</button>
      <div class="dropzone">
        <div class="dz-inner">Drop images here</div>
      </div>
      <div class="uploadpanel">
        <div class="uploadactions">
          <div class="choose-row">
            <img src="{{ url_for('static', filename='icons/icon-photo.svg') }}" alt="" width="30">
            <label class="choose" for="file-input">Choose Photo/Video</label>
          </div>
          <input type="file" name="image" id="file-input" style="display:none">
          <div class="or"><span>or</span></div>
          <input type="text" name="url" id="paste-url" placeholder="Paste image or URL">
        </div>
        <div class="uploadopts">
          <a class="opt active" href="/meme-generator">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4" width="18" height="14" rx="2" stroke="#ffffff" stroke-width="1.6"></rect><path d="M3 15l5-5 4 4 3-3 6 6" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"></path><circle cx="15.5" cy="8.5" r="1.6" fill="#ffffff"></circle></svg>
            <span>Meme Gen</span>
          </a>
          <span class="opt dim" title="My Uploads">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="5" width="18" height="14" rx="2" stroke="#8a8f98" stroke-width="1.6"></rect><path d="M8 12l3-3 2.5 2.5L16 10l4 4" stroke="#8a8f98" stroke-width="1.6" stroke-linejoin="round"></path></svg>
            <span>My Uploads</span>
          </span>
        </div>
      </div>
    </div>
    <div class="uploadmeta">
      <label for="up-title">Give your post a title</label>
      <input type="text" id="up-title" name="title" placeholder="Add a title" maxlength="300">
      <label for="up-desc">Description (optional)</label>
      <textarea id="up-desc" name="description" placeholder="Add a description"></textarea>
      <button class="btn btn-publish" type="submit">Post to Imgur</button>
      <p class="legal">By creating a post, you agree to Imgur’s <a href="/tos">Terms of Service</a> and <a href="/privacy">Privacy Policy</a></p>
    </div>
  </form>
</div>
{% endblock %}
