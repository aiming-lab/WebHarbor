{% extends "base.html" %}
{% block title %}Request Too Large — NVIDIA mirror{% endblock %}
{% block content %}
<section class="section" style="text-align:center;padding:96px 0">
  <div class="container">
    <div class="eyebrow green" style="font-weight:700;text-transform:uppercase;font-size:13px">Error 413</div>
    <h1 style="font-size:48px;font-weight:800;margin:12px 0">Request Too Large</h1>
    <p class="muted" style="max-width:520px;margin:0 auto 24px">This mirror accepts request bodies up to {{ limit_mb }} MB. Nothing was stored.</p>
    <a class="btn" href="{{ url_for('index') }}">Back to Home</a>
  </div>
</section>
{% endblock %}
