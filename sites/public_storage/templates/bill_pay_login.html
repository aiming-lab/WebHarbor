{% extends "base.html" %}
{% block title %}Pay Bill | Public Storage{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Pay Your Storage Bill</h1>
    <p style="font-size:14px; color: var(--ps-gray);">Enter your account number and the email address on your rental agreement.</p>
    <form method="post" action="/simplified/bill-pay/login">
      <div class="form-field">
        <label for="bp-account">Account Number</label>
        <input type="text" id="bp-account" name="accountNumber" placeholder="e.g. 483920" required>
      </div>
      <div class="form-field">
        <label for="bp-email">Email</label>
        <input type="email" id="bp-email" name="email" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Continue to Pay Bill</button>
    </form>
    <p class="auth-alt">Renting soon? <a href="/find-storage">Reserve a unit</a> — holds are free with no obligation.</p>
  </div>
</div>
{% endblock %}
