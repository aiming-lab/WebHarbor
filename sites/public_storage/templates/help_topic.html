{% extends "base.html" %}
{% block title %}{{ topic.label }} | Public Storage Help Center{% endblock %}
{% block content %}
<div class="page-wrap" style="max-width:760px;">
  <p><a href="/help/">← Help Center</a></p>
  <h1>{{ topic.label }}</h1>
  <p class="lede">{{ topic.summary }}</p>
  <div class="article-body" style="margin-top:22px;">
    {% for para in topic.body_list %}
    <p>{{ para }}</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
