{% extends "base.html" %}
{% block title %}Create an Account | Public Storage{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create an Account</h1>
    <form method="post" action="/myaccount/identity/create-account">
      <div class="form-field">
        <label for="registration-form-email">Email</label>
        <input type="email" id="registration-form-email" name="email" required>
        <div class="form-hint">We'll send your reservation confirmations here.</div>
      </div>
      <div class="form-field">
        <label for="registration-form-first">First Name</label>
        <input type="text" id="registration-form-first" name="firstName" required>
      </div>
      <div class="form-field">
        <label for="registration-form-last">Last Name</label>
        <input type="text" id="registration-form-last" name="lastName" required>
      </div>
      <div class="form-field">
        <label for="registration-form-phone">Phone Number</label>
        <input type="tel" id="registration-form-phone" name="phone" placeholder="(555) 555-1234" required>
      </div>
      <div class="form-field">
        <label for="registration-form-password">Password</label>
        <input type="password" id="registration-form-password" name="password" required>
        <div class="form-hint">At least 8 characters.</div>
      </div>
      <div class="form-field">
        <label for="registration-form-confirm">Confirm Password</label>
        <input type="password" id="registration-form-confirm" name="confirmPassword" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create Account</button>
    </form>
    <p class="auth-alt">Already have an account? <a href="/lease/sign-elease">Log In</a></p>
  </div>
</div>
{% endblock %}
