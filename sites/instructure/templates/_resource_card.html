{% if r is not defined %}{% set r = res %}{% endif %}
<div class="res-item">
  <a href="{{ r.href() }}">
    <div class="thumb">
      {% if r.card_img %}<img src="{{ r.card_img|img }}" alt="{{ r.title }}">{% endif %}
    </div>
  </a>
  <div class="type">{{ r.type_label }}</div>
  <h3><a href="{{ r.href() }}">{{ r.title }}</a></h3>
  {% if r.snippet %}<p class="snippet">{{ r.snippet }}</p>{% endif %}
  <a class="learn" href="{{ r.href() }}">Learn More <span class="chev">›</span></a>
</div>
