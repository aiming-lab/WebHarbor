{% extends "base.html" %}
{% block title %}Page Not Found | Instructure{% endblock %}
{% block content %}
<section class="container error-page">
  <h1>404</h1>
  <h2>The page you're looking for doesn't exist.</h2>

  <div style="display:flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
