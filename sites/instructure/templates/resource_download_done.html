{% extends "base.html" %}
{% block title %}{{ res.title }} | Instructure{% endblock %}
{% block content %}
<section class="container" style="padding-top: 70px;">
  <div class="gate-form text-center" style="background: #eaf6e4; border-color: #b7dfa1;">
    <h3>Check your inbox!</h3>
    <p class="hint" style="font-size: 16px;">Your copy of “{{ res.title }}” is on its way to the email address you provided. It should arrive within a few minutes.</p>
    <a class="btn btn-primary" href="{{ res.href() }}">Back to the resource</a>
  </div>
</section>
{% endblock %}
