{% extends "base.html" %}
{% block title %}Contact | B&H{% endblock %}
{% block content %}
<section class="shell page-hero simple">
    <p class="kicker">Contact</p>
    <h1>Reach the local demo support desk</h1>
    <p>Send a message to the B&amp;H support desk. Messages on this mirror are stored locally and are not delivered.</p>
</section>
<section class="shell form-shell">
    <form method="post" class="card-form">
        <label>Name
            <input type="text" name="name" placeholder="Demo customer">
        </label>
        <label>Email
            <input type="email" name="email" placeholder="demo@example.com">
        </label>
        <label>Topic
            <select name="topic">
                <option>Order support</option>
                <option>Store pickup</option>
                <option>Compatibility question</option>
                <option>Returns policy</option>
            </select>
        </label>
        <label>Message
            <textarea name="message" rows="5" placeholder="Tell us what you need help with."></textarea>
        </label>
        <button type="submit" class="cta">Send demo request</button>
    </form>
</section>
{% endblock %}
