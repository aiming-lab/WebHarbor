{% extends "base.html" %}
{% block title %}Register · B&H Demo Mirror{% endblock %}
{% block content %}
<section class="shell auth-wrap wide">
    <div class="auth-panel">
        <p class="kicker">Local-only account</p>
        <h1>Create a demo account</h1>
        <form method="post" class="card-form two-col">
            <label>Display name
                <input type="text" name="display_name" required>
            </label>
            <label>Username
                <input type="text" name="username" required>
            </label>
            <label>Email
                <input type="email" name="email" required>
            </label>
            <label>Phone
                <input type="text" name="phone">
            </label>
            <label>Company
                <input type="text" name="company">
            </label>
            <label>Role
                <input type="text" name="role" placeholder="Photographer, editor, producer...">
            </label>
            <label>Password
                <input type="password" name="password" required>
            </label>
            <label>Confirm password
                <input type="password" name="confirm_password" required>
            </label>
            <label>Address line 1
                <input type="text" name="line1">
            </label>
            <label>City
                <input type="text" name="city">
            </label>
            <label>State
                <input type="text" name="state">
            </label>
            <label>ZIP code
                <input type="text" name="zip_code">
            </label>
            <button type="submit" class="cta full">Create account</button>
        </form>
    </div>
</section>
{% endblock %}
