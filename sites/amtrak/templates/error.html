{% extends "base.html" %}
{% block title %}{{ code }} · Amtrak Demo Mirror{% endblock %}
{% block content %}
  <section class="page-hero">
    <div>
      <div class="eyebrow">Error {{ code }}</div>
      <h2>{{ heading }}</h2>
      <p>{{ detail }}</p>
      <div class="hero-actions">
        <a class="button" href="{{ url_for('index') }}">Back to the homepage</a>
        <a class="button-secondary" href="{{ url_for('booking_search') }}">Start a new search</a>
        <a class="button-ghost" href="{{ url_for('help_page') }}">Help center</a>
      </div>
    </div>
    <div class="hero-art">
      <img src="{{ url_for('static', filename='images/stations/NYP.svg') }}" alt="">
    </div>
  </section>
{% endblock %}
