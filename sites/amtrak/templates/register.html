{% extends "base.html" %}
{% block title %}Register · Amtrak Demo Mirror{% endblock %}
{% block content %}
  <section class="auth-card card">
    <div class="eyebrow">Create local demo account</div>
    <h2>Register a synthetic traveler profile for booking and rewards flows.</h2>
    <form class="detail-list" action="{{ url_for('register') }}" method="post">
      <div class="form-grid">
        <div class="field-wide">
          <label for="display_name">Display name</label>
          <input id="display_name" name="display_name">
        </div>
        <div class="field-wide">
          <label for="email">Email</label>
          <input id="email" type="email" name="email">
        </div>
        <div class="field-wide">
          <label for="first_name">First name</label>
          <input id="first_name" name="first_name">
        </div>
        <div class="field-wide">
          <label for="last_name">Last name</label>
          <input id="last_name" name="last_name">
        </div>
        <div class="field-wide">
          <label for="phone">Phone</label>
          <input id="phone" name="phone">
        </div>
        <div class="field-wide">
          <label for="preferred_station_code">Preferred station</label>
          <input id="preferred_station_code" list="station-directory" name="preferred_station_code">
        </div>
        <div class="field-wide">
          <label for="city">City</label>
          <input id="city" name="city">
        </div>
        <div class="field-wide">
          <label for="state">State</label>
          <input id="state" name="state">
        </div>
        <div class="field-wide">
          <label for="password">Password</label>
          <input id="password" type="password" name="password">
        </div>
        <div class="field-wide">
          <label for="confirm_password">Confirm password</label>
          <input id="confirm_password" type="password" name="confirm_password">
        </div>
      </div>
      <button class="button button-block" type="submit">Create account</button>
    </form>
  </section>
{% endblock %}
