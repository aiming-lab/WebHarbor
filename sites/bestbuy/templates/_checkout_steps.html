{% set steps = ['Choose fulfillment', 'Shipping / pickup', 'Payment', 'Review', 'Confirmation'] %}
<div class="checkout-steps">
  {% for step in steps %}
    <div class="checkout-step {% if loop.index0 <= current_step %}is-active{% endif %}">
      <span>{{ loop.index }}</span>
      <strong>{{ step }}</strong>
    </div>
  {% endfor %}
</div>
