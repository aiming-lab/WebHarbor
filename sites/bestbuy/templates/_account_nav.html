<aside class="account-nav">
  <a href="{{ url_for('account') }}" class="{% if request.endpoint == 'account' %}is-active{% endif %}">Account</a>
  <a href="{{ url_for('account_orders') }}" class="{% if request.endpoint == 'account_orders' %}is-active{% endif %}">Purchases</a>
  <a href="{{ url_for('account_rewards') }}" class="{% if request.endpoint == 'account_rewards' %}is-active{% endif %}">Points &amp; Rewards</a>
  <a href="{{ url_for('account_wishlist') }}" class="{% if request.endpoint == 'account_wishlist' %}is-active{% endif %}">Saved Items</a>
  <a href="{{ url_for('support_page') }}">Support</a>
  <form action="{{ url_for('logout') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="button button--ghost" type="submit">Sign out</button>
  </form>
</aside>
