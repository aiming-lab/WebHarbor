{# expects `page` dict, `base_path` and a `page_qs(n)` callable returning the query string #}
{% if page.pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  <a class="nav" href="{{ base_path }}?{{ page_qs(page.page - 1) }}" aria-disabled="{{ 'true' if page.page == 1 else 'false' }}" aria-label="Previous page"><svg class="ic"><use href="#i-chevron-left"/></svg></a>
  {% for number in page.numbers %}
    {% if number is none %}<span class="ellipsis">...</span>
    {% elif number == page.page %}<span class="current" aria-current="page">{{ number }}</span>
    {% else %}<a href="{{ base_path }}?{{ page_qs(number) }}">{{ number }}</a>{% endif %}
  {% endfor %}
  <a class="nav" href="{{ base_path }}?{{ page_qs(page.page + 1) }}" aria-disabled="{{ 'true' if page.page == page.pages else 'false' }}" aria-label="Next page"><svg class="ic"><use href="#i-chevron-right"/></svg></a>
</nav>
{% endif %}
