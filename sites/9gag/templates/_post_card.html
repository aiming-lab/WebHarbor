<article class="post-card" data-post-id="{{ post.source_id }}"><div class="post-meta"><a href="{{ url_for('interest',section=post.section) }}">{{ post.section|replace('-', ' ')|title }}</a><span>•</span><span>@{{ post.author_name }}</span></div><h2><a href="{{ url_for('post_detail',slug=post.slug) }}">{{ post.title }}</a></h2><a class="post-image" href="{{ url_for('post_detail',slug=post.slug) }}"><img src="{{ url_for('static',filename='images/' + post.image) }}" alt="{{ post.title }}"></a><div class="stats"><strong>{{ post.up_votes }}</strong> points · <strong>{{ post.comment_count }}</strong> comments</div><div class="actions"><form action="{{ url_for('vote',slug=post.slug) }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button aria-label="Upvote {{ post.title }}" class="{{ 'selected' if votes.get(post.id)==1 }}">▲</button><input type="hidden" name="value" value="1"></form><form action="{{ url_for('vote',slug=post.slug) }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button aria-label="Downvote {{ post.title }}" class="{{ 'selected' if votes.get(post.id)==-1 }}">▼</button><input type="hidden" name="value" value="-1"></form><a href="{{ url_for('post_detail',slug=post.slug) }}#comments">💬 Comment</a><form action="{{ url_for('save_post',slug=post.slug) }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>{{ '★ Saved' if post.id in saved_ids else '☆ Save' }}</button></form></div></article>
