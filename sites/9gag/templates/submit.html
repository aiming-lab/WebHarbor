{% extends 'base.html' %}{% block title %}Create a post - 9GAG{% endblock %}{% block body %}<main class="form-page"><h1>Create a post</h1><p>Share something the community will enjoy.</p><form method="post"><label>Title<input name="title" maxlength="300" required></label><label>Description<textarea name="description" rows="5"></textarea></label><label>Interest<select name="section">{% for key in ['humor','memes','gaming','animals','science','wholesome','sports','food','music','politics','random'] %}<option>{{ key }}</option>{% endfor %}</select></label><label>Tags<input name="tags" placeholder="funny|design|weekend"></label><label>Preview image<select name="image">{% for image in ['posts/aVvGONd-41d662a3.jpg','posts/adB3Nj9-f56e7b44.jpg','posts/aYQzNgV-f6067981.jpg','posts/aQzYqK8-ec9e7408.jpg'] %}<option value="{{ image }}">Image {{ loop.index }}</option>{% endfor %}</select></label><button class="primary">Publish post</button></form></main>{% endblock %}
