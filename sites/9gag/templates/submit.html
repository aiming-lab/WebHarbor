{% extends 'base.html' %}{% block title %}Create a post - 9GAG{% endblock %}{% block body %}<main class="form-page"><h1>Create a post</h1><p>Share something the community will enjoy.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" maxlength="300" required></label><label>Description<textarea name="description" rows="5"></textarea></label><label>Interest<select name="section">{% for key in interests %}<option>{{ key }}</option>{% endfor %}</select></label><label>Tags<input name="tags" placeholder="funny|design|weekend"></label><label>Preview image<select name="image">{% for image in images %}<option value="{{ image }}">Image {{ loop.index }}</option>{% endfor %}</select></label><button class="primary">Publish post</button></form></main>{% endblock %}
