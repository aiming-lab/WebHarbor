{% extends "base.html" %}{% block content %}<section class="narrow"><h1>hidden listings</h1><p>{{ 'Saved to your account.' if current_user.is_authenticated else 'Hidden in this browser session.' }}</p>{% for row in rows %}<article><a href="{{ url_for('listing_detail',slug=row.slug,listing_id=row.id) }}">{{ row.title }}</a><form method="post" action="{{ url_for('unhide_listing',listing_id=row.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>unhide</button></form></article>{% else %}<p>No hidden listings.</p>{% endfor %}</section>{% endblock %}
