<article class="item-card">
  <a class="art" href="{{ url_for('listing_detail', slug=item.slug) }}"><img src="{{ url_for('art', slug=item.slug) }}" alt="{{ item.name }}"></a>
  <div class="card-body"><span class="eyebrow">{{ item.category }}</span><h3><a href="{{ url_for('listing_detail', slug=item.slug) }}">{{ item.name }}</a></h3><p>{{ item.summary }}</p><dl><div><dt>Score</dt><dd>{{ item.score }}</dd></div><div><dt>Price</dt><dd>${{ item.price }}</dd></div><div><dt>Status</dt><dd>{{ item.status }}</dd></div></dl></div>
</article>
