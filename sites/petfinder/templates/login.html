{% extends "base.html" %}
{% block title %}Sign in | Petfinder{% endblock %}
{% block content %}
<section class="auth-layout">
  <form method="post" class="auth-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1>
    <p>Access your saved pets and adoption inquiries.</p>
    <label>Email address<input type="email" name="email" autocomplete="username" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
