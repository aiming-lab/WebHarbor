{% extends "base.html" %}
{% block title %}Sitemap | LandWatch{% endblock %}
{% block content %}
<div class="lw-static-page">
  <h1>Land for Sale by State and Category</h1>
  <div style="columns: 3 260px; column-gap: 34px;">
    {% for link in links %}
      <a href="{{ link.href }}" style="display: block; padding: 5px 0; font-size: 14px; color: #333;">{{ link.text }}</a>
    {% endfor %}
  </div>
</div>
{% endblock %}
