{% extends "base.html" %}
{% block title %}Edit profile | LandWatch{% endblock %}
{% block content %}
<div class="lw-auth-wrap">
  <div class="lw-auth-card">
    <h2>Edit profile</h2>
    <form method="post" action="/account/edit">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" value="{{ user.name or '' }}">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" value="{{ user.phone or '' }}">
      <button class="lw-btn lw-btn-primary" type="submit" style="width: 100%;">Save changes</button>
    </form>
    <p class="lw-auth-alt"><a href="/account">Back to My LandWatch</a></p>
  </div>
</div>
{% endblock %}
