{% extends "base.html" %}
{% block title %}Create account - My Porsche{% endblock %}
{% block content %}
<section class="auth-card">
  <h1 class="page-title">Create your My Porsche account</h1>
  <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="first_name">First name</label>
      <input id="first_name" name="first_name" type="text" required value="{{ form.get('first_name', '') }}">
    </div>
    <div>
      <label for="last_name">Last name</label>
      <input id="last_name" name="last_name" type="text" required value="{{ form.get('last_name', '') }}">
    </div>
    <div>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required value="{{ form.get('email', '') }}">
    </div>
    <div>
      <label for="password">Password (min. 8 characters)</label>
      <input id="password" name="password" type="password" minlength="8" required>
    </div>
    <button class="btn btn-red" type="submit">Create account</button>
  </form>
  <p class="form-note mt2">Already registered? <a href="/my-porsche/sign-in">Sign in</a>.</p>
</section>
{% endblock %}
