{% extends "base.html" %}
{% block title %}Sign in - My Porsche{% endblock %}
{% block content %}
<section class="auth-card">
  <h1 class="page-title">Sign in</h1>
  <p class="page-sub">Welcome back to My Porsche.</p>
  <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" required>
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
    </div>
    <button class="btn btn-red" type="submit">Sign in</button>
  </form>
  <p class="form-note mt2">New to My Porsche? <a href="/my-porsche/register">Create an account</a>.</p>
</section>
{% endblock %}
