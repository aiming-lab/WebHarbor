{% extends "base.html" %}
{% block title %}Register - Bandcamp Mirror{% endblock %}
{% block content %}
<section class="container auth-shell">
    <form class="auth-card" method="post">
        <h1>Create a fan account</h1>
        <div class="form-grid">
            <label>Display name
                <input type="text" name="display_name" required>
            </label>
            <label>Username
                <input type="text" name="username" required placeholder="fanhandle">
            </label>
            <label>Email
                <input type="email" name="email" required>
            </label>
            <label>City
                <input type="text" name="city" placeholder="Seattle">
            </label>
            <label>Password
                <input type="password" name="password" required>
            </label>
            <label>Confirm password
                <input type="password" name="confirm_password" required>
            </label>
            <label>Favorite format
                <select name="favorite_format">
                    <option value="digital">Digital</option>
                    <option value="vinyl">Vinyl</option>
                    <option value="cassette">Cassette</option>
                    <option value="cd">CD</option>
                    <option value="shirt">Merch</option>
                </select>
            </label>
        </div>
        <button class="button-primary" type="submit">Sign up</button>
    </form>
</section>
{% endblock %}
