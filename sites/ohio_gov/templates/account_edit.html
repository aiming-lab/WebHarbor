{% extends "base.html" %}
{% block title %}Edit Profile | Ohio.gov | Official Website of the State of Ohio{% endblock %}
{% block content %}
<article class="odx-content odx-content--account-edit">
    <div class="container">
        <div class="row">
            <div class="col-xs-12 col-sm-12 col-md-8 col-lg-6">
                <section class="odx-content-section odx-content-section--landing-page-intro">
                    <header id="odx-content-header" class="odx-content__header">
                        <div class="odx-title">
                            <h1 class="odx-content__title">Edit Profile</h1>
                        </div>
                    </header>
                </section>

                <section class="odx-content-section">
                    <form method="post" action="{{ url_for('account_edit') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="form-group">
                            <label for="display_name">Display name</label>
                            <input type="text" class="form-control" id="display_name" name="display_name" value="{{ current_user.display_name or '' }}">
                        </div>
                        <div class="row">
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label for="first_name">First name</label>
                                    <input type="text" class="form-control" id="first_name" name="first_name" value="{{ current_user.first_name or '' }}">
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label for="last_name">Last name</label>
                                    <input type="text" class="form-control" id="last_name" name="last_name" value="{{ current_user.last_name or '' }}">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone" value="{{ current_user.phone or '' }}">
                        </div>
                        <div class="form-group">
                            <label for="address_line1">Street address</label>
                            <input type="text" class="form-control" id="address_line1" name="address_line1" value="{{ current_user.address_line1 or '' }}">
                        </div>
                        <div class="row">
                            <div class="col-sm-5">
                                <div class="form-group">
                                    <label for="city">City</label>
                                    <input type="text" class="form-control" id="city" name="city" value="{{ current_user.city or '' }}">
                                </div>
                            </div>
                            <div class="col-sm-4">
                                <div class="form-group">
                                    <label for="state">State</label>
                                    <input type="text" class="form-control" id="state" name="state" value="{{ current_user.state or 'Ohio' }}">
                                </div>
                            </div>
                            <div class="col-sm-3">
                                <div class="form-group">
                                    <label for="zip">ZIP</label>
                                    <input type="text" class="form-control" id="zip" name="zip" value="{{ current_user.zip or '' }}">
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-primary" type="submit">Save changes</button>
                        <a class="btn btn-secondary margin-left-xs" href="{{ url_for('account') }}">Cancel</a>
                    </form>
                </section>
            </div>
        </div>
    </div>
</article>
{% endblock %}
