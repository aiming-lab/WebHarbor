{% extends "base.html" %}
{% block title %}Create an OHID | Ohio.gov | Official Website of the State of Ohio{% endblock %}
{% block content %}
<article class="odx-content odx-content--register">
    <div class="container">
        <div class="row">
            <div class="col-xs-12 col-sm-12 col-md-8 col-lg-6">
                <section class="odx-content-section odx-content-section--landing-page-intro">
                    <header id="odx-content-header" class="odx-content__header">
                        <div class="odx-title">
                            <h1 class="odx-content__title">Create an OHID</h1>
                            <div class="odx-content__summary">
                                One account for State of Ohio services.
                            </div>
                        </div>
                    </header>
                </section>

                <section class="odx-content-section">
                    <form method="post" action="{{ url_for('register') }}">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="display_name">Display name</label>
                            <input type="text" class="form-control" id="display_name" name="display_name">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="form-group">
                            <label for="password2">Confirm password</label>
                            <input type="password" class="form-control" id="password2" name="password2" required>
                        </div>
                        <button class="btn btn-primary" type="submit">Create account</button>
                        <a class="btn btn-secondary margin-left-xs" href="{{ url_for('login') }}">I already have an OHID</a>
                    </form>
                </section>
            </div>
        </div>
    </div>
</article>
{% endblock %}
