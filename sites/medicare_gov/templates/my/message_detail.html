{% extends "base.html" %}
{% block title %}{{ msg.subject }} | Medicare{% endblock %}
{% block content %}
<div class="ds-container" style="padding-top:30px">
  <div class="my-layout">
    <div class="my-content" style="grid-column:1/-1;max-width:760px">
      <p class="small muted"><a href="{{ url_for('messages') }}">← Back to messages</a></p>
      <h1>{{ msg.subject }}</h1>
      <p class="small muted">Received {{ msg.received_at }}</p>
      <div class="my-panel">
        <p>{{ msg.body }}</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
