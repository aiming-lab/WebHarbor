{% extends "base.html" %}
{% block title %}{{ month.headline }}{% endblock %}
{% block content %}
<section class="detail-hero">
  <img src="{{ url_for('illustration', kind='baby', slug='month-' ~ month.month) }}" alt="{{ month.headline }}">
  <div><div class="eyebrow">Month {{ month.month }}</div><h1>{{ month.headline }}</h1><p>{{ month.milestones }}</p></div>
</section>
<section class="content-columns">
  <article><h2>Milestones</h2><p>{{ month.milestones }}</p></article>
  <article><h2>Feeding</h2><p>{{ month.feeding }}</p></article>
  <article><h2>Sleep</h2><p>{{ month.sleep }}</p></article>
</section>
{% endblock %}
