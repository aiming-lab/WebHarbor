{% extends "base.html" %}
{% block title %}Baby Month by Month{% endblock %}
{% block content %}
<section class="page-heading"><div><div class="eyebrow">Development tracker</div><h1>Baby Month by Month</h1></div></section>
<section class="timeline-grid">
  {% for month in months %}
    <a class="timeline-card" href="{{ url_for('month_detail', month=month.month) }}"><span>Month {{ month.month }}</span><strong>{{ month.headline }}</strong><small>{{ month.milestones }}</small></a>
  {% endfor %}
</section>
{% endblock %}
