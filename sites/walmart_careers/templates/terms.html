{% extends "base.html" %}
{% block title %}Terms &amp; Conditions | Walmart Careers{% endblock %}
{% block content %}
<section>
  <div class="wrap-narrow">
    <h1 style="font-size:40px;font-weight:400">{{ content.TERMS_HEADING }}</h1>
    {% for heading, body in content.TERMS_SECTIONS %}
      <h2 style="font-size:24px;font-weight:700;margin-top:28px">{{ heading }}</h2>
      <p>{{ body }}</p>
    {% endfor %}
    <p class="legal">{{ content.FOOTER_EEO }}</p>
  </div>
</section>
{% endblock %}
