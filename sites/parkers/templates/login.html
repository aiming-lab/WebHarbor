{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="wrap">
  <div class="two-col">
    <div class="sidebar-box">
      <div class="page-heading"><h1>Log in to My Parkers</h1></div>
      <form method="post" action="/my-parkers/login/{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="li-email">Email address</label>
          <input type="email" id="li-email" name="email" required>
        </div>
        <div class="field">
          <label for="li-pw">Password</label>
          <input type="password" id="li-pw" name="password" required>
        </div>
        <button class="btn btn--primary" type="submit">Log in</button>
      </form>
      <p class="small">New to Parkers? <a href="/my-parkers/register/">Create an account</a></p>
    </div>
    <aside>
      <div class="sidebar-box">
        <h3>Why a Parkers account?</h3>
        <ul class="plan-list">
          <li>Save valuations to your account</li>
          <li>Shortlist cars for sale</li>
          <li>Write owner reviews</li>
        </ul>
      </div>
    </aside>
  </div>
</div>
{% endblock %}
