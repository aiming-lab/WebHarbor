{% extends "base.html" %}
{% block title %}Edit profile | Amazon.jobs{% endblock %}
{% block content %}
<div class="container page-content account-page narrow">
  <div class="account-head">
    <h1>Edit profile</h1>
    <p class="account-sub">Keep your details current so recruiters see the latest information.</p>
  </div>
  <form method="post" action="{{ url_for('profile_edit') }}" class="settings-form">
    <div class="form-grid">
      <label for="display_name">Display name
        <input type="text" id="display_name" name="display_name" value="{{ user.display_name }}" required>
      </label>
      <label for="first_name">First name
        <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" required>
      </label>
      <label for="last_name">Last name
        <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}" required>
      </label>
      <label for="phone">Phone
        <input type="tel" id="phone" name="phone" value="{{ user.phone }}">
      </label>
      <label for="city">City
        <input type="text" id="city" name="city" value="{{ user.city }}">
      </label>
      <label for="state">State
        <input type="text" id="state" name="state" value="{{ user.state }}">
      </label>
      <label for="country">Country
        <input type="text" id="country" name="country" value="{{ user.country }}">
      </label>
      <label for="headline">Professional headline
        <input type="text" id="headline" name="headline" value="{{ user.headline }}" placeholder="e.g. Senior Software Engineer">
      </label>
      <label for="linkedin_url" class="full">LinkedIn URL
        <input type="url" id="linkedin_url" name="linkedin_url" value="{{ user.linkedin_url }}" placeholder="https://www.linkedin.com/in/">
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a class="btn btn-secondary" href="{{ url_for('profile') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
