{% extends "base.html" %}
{% block content %}
<div class="container section" style="max-width:640px">
  <h1>Request a tour</h1>
  <p style="color:var(--c-gray-4)">{{ listing.address }} · {{ listing.city }}, {{ listing.state }}</p>
  <form method="post" class="form-narrow" style="margin:0">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="field-date">Date</label><input id="field-date" type="date" name="date" required></div>
    <div class="field"><label for="field-time">Time</label>
      <select id="field-time" name="time" required>
        {% for t in ['9:00 AM','10:00 AM','11:00 AM','12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM'] %}
          <option>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field"><label for="field-tour_type">Tour type</label>
      <select id="field-tour_type" name="tour_type">
        <option value="in-person">In-person</option>
        <option value="video">Video tour</option>
      </select>
    </div>
    <div class="field"><label for="field-phone">Phone</label><input id="field-phone" type="tel" name="phone" value="{{ current_user.phone }}"></div>
    <div class="field"><label for="field-notes">Notes for the agent</label><textarea id="field-notes" name="notes"></textarea></div>
    <button class="btn" type="submit">Submit request</button>
    <a class="btn outline" href="{{ url_for('listing_detail', slug=listing.slug) }}">Cancel</a>
  </form>
</div>
{% endblock %}
