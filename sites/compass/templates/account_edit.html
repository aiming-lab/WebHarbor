{% extends "base.html" %}
{% block content %}
<div class="container dashboard">
  {% include "_account_nav.html" %}
  <div>
    <h1>Edit profile</h1>
    <form method="post" class="form-narrow" style="margin:0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="field-name">Full name</label><input id="field-name" type="text" name="name" value="{{ user.name }}" required></div>
      <div class="field"><label for="field-phone">Phone</label><input id="field-phone" type="tel" name="phone" value="{{ user.phone }}"></div>
      <div class="field"><label for="field-city">City</label><input id="field-city" type="text" name="city" value="{{ user.city }}"></div>
      <div class="field"><label for="field-state">State</label><input id="field-state" type="text" name="state" value="{{ user.state }}" maxlength="2"></div>
      <button class="btn" type="submit">Save changes</button>
      <a class="btn outline" href="{{ url_for('account') }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
