{% extends "base.html" %}
{% block content %}
<div class="container dashboard">
  {% include "_account_nav.html" %}
  <div>
    <h1>New collection</h1>
    <form method="post" class="form-narrow" style="margin:0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="field-name">Collection name</label><input id="field-name" type="text" name="name" required placeholder='e.g. "Austin top picks"'></div>
      <div class="field"><label for="field-description">Description (optional)</label><textarea id="field-description" name="description"></textarea></div>
      <button class="btn" type="submit">Create collection</button>
      <a class="btn outline" href="{{ url_for('collections_index') }}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
