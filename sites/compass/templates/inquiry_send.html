{% extends "base.html" %}
{% block content %}
<div class="container section" style="max-width:640px">
  <h1>Contact agent</h1>
  <p style="color:var(--c-gray-4)">About: {{ listing.address }}{% if listing.agent %} · Agent {{ listing.agent.name }}{% endif %}</p>
  <form method="post" class="form-narrow" style="margin:0">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if not current_user.is_authenticated %}
      <div class="field"><label for="field-name">Your name</label><input id="field-name" type="text" name="name" required></div>
      <div class="field"><label for="field-email">Email</label><input id="field-email" type="email" name="email" required></div>
    {% endif %}
    <div class="field"><label for="field-phone">Phone</label><input id="field-phone" type="tel" name="phone" value="{{ current_user.phone if current_user.is_authenticated else '' }}"></div>
    <div class="field"><label for="field-subject">Subject</label><input id="field-subject" type="text" name="subject" value="Inquiry about {{ listing.address }}"></div>
    <div class="field"><label for="field-message">Message</label><textarea id="field-message" name="message" required placeholder="I'm interested in this property and would like more information..."></textarea></div>
    <button class="btn" type="submit">Send message</button>
    <a class="btn outline" href="{{ url_for('listing_detail', slug=listing.slug) }}">Cancel</a>
  </form>
</div>
{% endblock %}
