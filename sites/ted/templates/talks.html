{% extends "base.html" %}
{% block title %}TED Talks{% endblock %}
{% block content %}
<section class="page-head">
  <p class="eyebrow">Watch</p>
  <h1>{% if topic %}Talks about {{ topic }}{% else %}TED Talks{% endif %}</h1>
  <form class="filters" method="get">
    <label>Topic
      <select name="topic">
        <option value="">All topics</option>
        {% for item in topics %}
          <option value="{{ item }}" {% if topic == item|lower %}selected{% endif %}>{{ item }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Event
    <select name="event">
      <option value="">All events</option>
      {% for item in events %}
        <option value="{{ item }}" {% if event == item %}selected{% endif %}>{{ item }}</option>
      {% endfor %}
    </select>
    </label>
    <label>Maximum duration in minutes
      <input type="number" name="max_minutes" min="1" max="180" placeholder="Max minutes" value="{{ max_minutes or '' }}">
    </label>
    <button type="submit">Apply filters</button>
  </form>
</section>
<section class="band">
  <div class="grid">
    {% for talk in talks %}
      {% include "_talk_card.html" %}
    {% else %}
      <p>No talks matched those filters.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
