{% extends "base.html" %}
{% block content %}
<section class="auth-page">
  <form class="panel" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Create account</h1>
    <label>Name<input name="display_name" maxlength="120" required></label>
    <label>Username<input name="username" maxlength="40" required></label>
    <label>Email<input type="email" name="email" maxlength="160" required></label>
    <label>Password<input type="password" name="password" minlength="8" maxlength="256" autocomplete="new-password" required></label>
    <button type="submit">Create account</button>
  </form>
</section>
{% endblock %}
