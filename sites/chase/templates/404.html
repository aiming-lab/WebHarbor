{% extends "base.html" %}
{% block title %}Page not found | Chase{% endblock %}
{% block content %}
<div class="container">
  <div class="section" style="text-align:center;">
    <h1>We couldn't find that page</h1>
    <p class="muted">The page you're looking for may have moved, or the address may be mistyped.</p>
    <p>
      <a class="btn btn--blue" href="{{ url_for('index') }}">Back to chase.com</a>
      <a class="btn btn--outline" href="{{ url_for('search') }}">Search</a>
    </p>
  </div>
</div>
{% endblock %}
