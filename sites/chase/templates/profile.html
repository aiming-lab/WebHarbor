{% extends "base.html" %}
{% block title %}Profile & settings | Chase{% endblock %}
{% block content %}
<div class="container">
  <div class="section">
    <h1>Profile &amp; settings</h1>
    <p class="muted">Update the personal information on your Chase online profile.</p>
    <div class="form-card form-card--wide">
      <form method="post" action="{{ url_for('account_profile') }}">
        <div class="form-grid-2">
          <div>
            <label for="first_name">First name</label>
            <input id="first_name" name="first_name" type="text" value="{{ user.first_name }}" required>
          </div>
          <div>
            <label for="last_name">Last name</label>
            <input id="last_name" name="last_name" type="text" value="{{ user.last_name }}" required>
          </div>
        </div>
        <label for="email">Email address</label>
        <input id="email" name="email" type="text" value="{{ user.email }}" required>
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="text" value="{{ user.phone }}">
        <label for="address1">Street address</label>
        <input id="address1" name="address1" type="text" value="{{ user.address1 }}">
        <div class="form-grid-2">
          <div>
            <label for="city">City</label>
            <input id="city" name="city" type="text" value="{{ user.city }}">
          </div>
          <div>
            <label for="state">State (2-letter code)</label>
            <input id="state" name="state" type="text" value="{{ user.state }}" maxlength="2">
          </div>
        </div>
        <label for="zip">ZIP code</label>
        <input id="zip" name="zip" type="text" value="{{ user.zip }}" maxlength="5">
        <div class="form-actions">
          <button class="btn btn--green" type="submit">Save changes</button>
          <a href="{{ url_for('account') }}">Back to accounts</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
