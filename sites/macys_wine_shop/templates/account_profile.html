{% extends "base.html" %}
{% block title %}Profile – MacysWine Shop{% endblock %}
{% block content %}
<div class="account-layout">
  <nav class="account-nav">
    <a href="/account">Dashboard</a>
    <a href="/account/orders">Orders</a>
    <a href="/account/addresses">Addresses</a>
    <a href="/account/payment">Payment methods</a>
    <a class="active" href="/account/profile">Profile</a>
    <a href="/account/password">Password</a>
  </nav>
  <div class="account-main">
    <h1>Profile</h1>
    {% if saved %}<div class="form-ok">Profile updated.</div>{% endif %}
    {% if errors.get('name') %}<div class="form-error">{{ errors['name'] }}</div>{% endif %}
    <form method="post" action="/account/profile" style="max-width:480px">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">
        <div class="field"><label for="first_name">First name</label><input id="first_name" name="first_name" value="{{ user.first_name }}" required></div>
        <div class="field"><label for="last_name">Last name</label><input id="last_name" name="last_name" value="{{ user.last_name }}" required></div>
        <div class="field full"><label for="email">Email (read-only)</label><input id="email" value="{{ user.email }}" disabled></div>
        <div class="field full"><label for="phone">Phone</label><input id="phone" name="phone" value="{{ user.phone }}"></div>
      </div>
      <button class="btn-primary" type="submit" style="margin-top:16px;max-width:220px">Save Profile</button>
    </form>
  </div>
</div>
{% endblock %}
