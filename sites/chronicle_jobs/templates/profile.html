{% extends "base.html" %}
{% block content %}
<div class="form-card">
  <h1>Your profile</h1>
  <form method="post" action="/profile/">
    <label for="first_name">First name</label>
    <input id="first_name" type="text" name="first_name" value="{{ current_user.first_name }}">
    <label for="last_name">Last name</label>
    <input id="last_name" type="text" name="last_name" value="{{ current_user.last_name }}">
    <label for="phone">Phone</label>
    <input id="phone" type="tel" name="phone" value="{{ current_user.phone }}">
    <label for="location">Location</label>
    <input id="location" type="text" name="location" value="{{ current_user.location }}" placeholder="e.g. City, State">
    <label for="headline">Professional headline</label>
    <input id="headline" type="text" name="headline" value="{{ current_user.headline }}" placeholder="e.g. Higher education administrator">
    <label for="new_password">New password</label>
    <input id="new_password" type="password" name="new_password">
    <div class="help">Leave blank to keep your current password. At least 8 characters.</div>
    <input class="btn-apply" type="submit" value="Save changes">
  </form>
</div>
{% endblock %}
