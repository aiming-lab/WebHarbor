{% extends "base.html" %}
{% block content %}
<div class="content-page">
  <h1>Popular job searches</h1>
  <p>Curated landing pages for the most common higher-education job searches.</p>
  <ul class="landing-list">
    {% for page in pages %}
    <li><a href="/landingpage/{{ page.landing_id }}/{{ page.slug }}/">{{ page.title }}</a></li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
