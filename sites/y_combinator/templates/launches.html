{% extends "base.html" %}

{% block content %}
<h1>Launch YC</h1>
<p>New YC companies launching their products.</p>
<div class="launch-list">
    {% for launch in launches %}
        <div class="launch-item" style="margin-bottom: 30px; padding: 20px; background: white; border-radius: 8px;">
            <h2><a href="{{ launch.url }}" target="_blank">{{ launch.title }}</a></h2>
            <p>{{ launch.tagline }}</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
