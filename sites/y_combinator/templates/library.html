{% extends "base.html" %}

{% block content %}
<h1>YC Library</h1>
<p>A collection of resources for founders.</p>
<div class="library-grid">
    {% for item in items %}
        <div class="library-item" style="padding: 15px; background: white; margin-bottom: 10px; border-radius: 4px;">
            <h3><a href="{{ url_for('library_detail', slug=item.slug) }}">{{ item.title }}</a></h3>
        </div>
    {% endfor %}
</div>
{% endblock %}
