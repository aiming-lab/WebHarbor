{% extends "base.html" %}

{% block content %}
<h1>YC Blog</h1>
<div class="blog-list">
    {% for post in posts %}
        <div class="blog-post" style="margin-bottom: 40px; padding: 20px; background: white; border-radius: 8px;">
            <h2><a href="{{ url_for('blog_detail', slug=post.slug) }}">{{ post.title }}</a></h2>
            <p class="date" style="color: #666; font-size: 0.9em;">{{ post.date }}</p>
            <p>{{ post.snippet }}</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
