{% extends "base.html" %}

{% block content %}
<h1>Founder Directory</h1>
<div class="founder-grid">
    {% for founder in founders %}
        <div class="founder-card" style="margin-bottom: 20px; padding: 15px; background: white; border-radius: 8px;">
            <h3>{{ founder.name }}</h3>
            <p class="title">{{ founder.title }}</p>
            <p class="bio">{{ founder.bio }}</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
