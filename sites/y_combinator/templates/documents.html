{% extends "base.html" %}

{% block content %}
<h1>Standard SAFE and Legal Documents</h1>
<div class="doc-list">
    {% for doc in docs %}
        <div class="doc-item" style="padding: 10px; border-bottom: 1px solid #ddd;">
            <a href="{{ doc.url }}" target="_blank">{{ doc.title }}</a>
        </div>
    {% endfor %}
</div>
{% endblock %}
