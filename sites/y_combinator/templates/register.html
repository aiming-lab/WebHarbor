{% extends "base.html" %}
{% block title %}Create an account | Y Combinator{% endblock %}

{% block content %}
<div class="shell detail" style="max-width:420px">
    <h1>Create an account</h1>
    <form method="POST">
        <div class="field"><label for="name">Name</label>
            <input id="name" type="text" name="name" style="width:100%;padding:10px;border:1px solid var(--rule);border-radius:6px;font-family:inherit"></div>
        <div class="field" style="margin-top:14px"><label for="email">Email</label>
            <input id="email" type="email" name="email" required style="width:100%;padding:10px;border:1px solid var(--rule);border-radius:6px;font-family:inherit"></div>
        <div class="field" style="margin-top:14px"><label for="password">Password</label>
            <input id="password" type="password" name="password" required style="width:100%;padding:10px;border:1px solid var(--rule);border-radius:6px;font-family:inherit"></div>
        <p><button class="button" type="submit">Create account</button></p>
    </form>
</div>
{% endblock %}
