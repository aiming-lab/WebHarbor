{% extends "base.html" %}
{% block title %}SoundCloud — Create account{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create your SoundCloud account</h1>
    <form method="post" action="/signup">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required autofocus placeholder="you@example.com">
      <label for="display">Display name</label>
      <input type="text" id="display" name="display" required placeholder="How should we call you?">
      <label for="age">Age</label>
      <input type="number" id="age" name="age" min="13" max="120" placeholder="13+">
      <label for="password">Password (min 6 characters)</label>
      <input type="password" id="password" name="password" required minlength="6" placeholder="Create a password">
      <button class="btn btn-primary" type="submit">Create account</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="/signin">Sign in</a></div>
  </div>
</div>
{% endblock %}
