{% extends "base.html" %}
{% block title %}Quizzes{% endblock %}
{% block content %}
<div class="section-header">
  <img class="title-icon-left" src="/static/images/theme/title-icon1.svg" alt="">
  <h2>Quizzes</h2>
  <img class="title-icon-right" src="/static/images/theme/title-icon2.svg" alt="">
</div>

<div class="quiz-frame">
  <div class="quiz-panel">
    <div class="quiz-landing">
      <div class="subject-tiles">
      <div class="game-header landing" style="background-color:#258a96;border-radius:10px;padding:10px 0;">
        <img src="/static/images/quiz/subject-headers/select-a-quiz.png" alt="Select a quiz" class="subject-image">
      </div>
        <div class="subject-tile addition"><a href="{{ url_for('quiz_page', operation='addition') }}"><span class="op-sym">+</span>ADDITION</a></div>
        <div class="subject-tile subtraction"><a href="{{ url_for('quiz_page', operation='subtraction') }}"><span class="op-sym">−</span>SUBTRACTION</a></div>
        <div class="subject-tile multiplication"><a href="{{ url_for('quiz_page', operation='multiplication') }}"><span class="op-sym">×</span>MULTIPLICATION</a></div>
        <div class="subject-tile division"><a href="{{ url_for('quiz_page', operation='division') }}"><span class="op-sym">÷</span>DIVISION</a></div>
      </div>
      <div class="promo-container">
        <img src="/static/images/quiz/certificate-promo.png" alt="Certificate Promo">
      </div>
    </div>
  </div>
</div>
{% endblock %}
