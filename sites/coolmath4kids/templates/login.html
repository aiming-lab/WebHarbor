{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="auth-form">
  <h1 style="font-family:'Galindo',cursive;font-weight:400;color:var(--purple);text-align:center;font-size:32px;margin:6px 0 10px;">Sign In</h1>
  <p style="text-align:center;color:#456;margin:0 0 8px;">Track your quiz scores, certificates and favorite games.</p>
  <form method="post" action="{{ url_for('login') }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus autocomplete="email">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
    <button type="submit">Sign In</button>
  </form>
  <div class="alt-link">New here? <a href="{{ url_for('register') }}" style="color:var(--teal);font-weight:700;">Create an account</a></div>
</div>
{% endblock %}
