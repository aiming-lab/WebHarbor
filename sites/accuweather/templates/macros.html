{% macro icon(code,alt) %}<img class="weather-icon" src="{{url_for('static',filename='images/weather-'~code~'.svg')}}" alt="{{alt}}">{% endmacro %}
{% macro tabs(loc) %}<nav class="tabs"><a href="{{url_for('weather',slug=loc.slug)}}">Current Weather</a><a href="{{url_for('hourly',slug=loc.slug)}}">Hourly</a><a href="{{url_for('daily',slug=loc.slug)}}">Daily</a><a href="{{url_for('radar',slug=loc.slug)}}">Radar</a><a href="{{url_for('air_quality',slug=loc.slug)}}">Air Quality</a></nav>{% endmacro %}
