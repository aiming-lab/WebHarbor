{% extends 'base.html' %}{% block content %}<section class="narrow"><div class="account-head"><h1>My AccuWeather</h1><a href="{{url_for('settings')}}">Settings</a><form method="post" action="{{url_for('logout')}}"><button>Sign out</button></form></div><h2>Saved Locations</h2><div class="results">{% for l in saved %}<a class="result" href="{{url_for('weather',slug=l.slug)}}"><span><b>{{l.city}}, {{l.region}}</b><small>{{l.condition}}</small></span><strong>{{display_temp(l.temp)}}°</strong></a>{% else %}<div class="card empty">You have no saved locations.</div>{% endfor %}</div></section>{% endblock %}
