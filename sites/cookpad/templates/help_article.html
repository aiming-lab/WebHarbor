{% extends "base.html" %}
{% block title %}{{ article.title }}{% endblock %}
{% block content %}
<div class="container" style="margin-top:32px;max-width:860px;">
    <a href="{{ url_for('help_center') }}" class="view-all">&larr; Back to help</a>
    <div class="empty-state" style="margin-top:18px;text-align:left;">
        <h1>{{ article.title }}</h1>
        <p style="margin-top:12px;color:#666;">{{ article.summary }}</p>
        <div style="margin-top:18px;line-height:1.8;">{{ article.body }}</div>
    </div>
</div>
{% endblock %}
