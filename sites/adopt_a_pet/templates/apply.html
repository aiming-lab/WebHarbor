{% extends 'base.html' %}{% block content %}<section class="auth"><h1>Ask about {{pet.name}}</h1><p>Your message will go to {{pet.shelter.name}}.</p>{% if error %}<p class="form-error" role="alert">{{error}}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Phone<input name="phone" maxlength="20" required></label><label>Housing<select name="housing"><option>Own home</option><option>Rent with permission</option><option>Other</option></select></label><label>Tell us about your pet experience<textarea name="experience" minlength="15" maxlength="2000" required></textarea></label><button>Submit inquiry</button></form></section>{% endblock %}
