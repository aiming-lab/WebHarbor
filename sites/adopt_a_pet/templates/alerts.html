{% extends 'base.html' %}{% block content %}<section class="auth"><h1>Create a New Pet Alert</h1>{% if error %}<p class="form-error" role="alert">{{error}}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Pet type<select name="species"><option>Dog</option><option>Cat</option></select></label><label>Breed<input name="breed" maxlength="80" placeholder="Any breed"></label><label>Postal code<input name="postal" inputmode="numeric" pattern="[0-9]{5}" maxlength="10" required></label><label>Distance<select name="radius"><option value="10">10 miles</option><option value="25">25 miles</option><option value="50">50 miles</option><option value="100">100 miles</option></select></label><button>Create alert</button></form></section>{% endblock %}
