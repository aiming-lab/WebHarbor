{% macro card(p) %}<article class="pet-card"><a href="{{url_for('pet',slug=p.slug)}}"><img src="{{url_for('static',filename='images/'~p.image)}}" alt="{{p.name}}, {{p.breed}}"><div><h3>{{p.name}}</h3><p>{{p.breed}}{{' · '~p.secondary_breed if p.secondary_breed}}</p><p>{{p.sex}}, {{p.age_group}}</p><small>{{p.city}}, {{p.state}}</small></div></a></article>{% endmacro %}
