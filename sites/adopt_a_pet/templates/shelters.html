{% extends 'base.html' %}{% block content %}<section class="wide"><h1>Find an animal shelter or rescue</h1><form class="shelter-search"><label>Search by shelter name or location<input name="q" value="{{q}}"></label><button>Search</button></form><div class="shelters">{% for s in shelters %}<a href="{{url_for('shelter',id=s.id)}}"><h2>{{s.name}}</h2><p>{{s.city}}, {{s.state}}</p><p>{{s.pets|length}} adoptable pets</p></a>{% else %}<p>No shelters matched your search.</p>{% endfor %}</div></section>{% endblock %}
