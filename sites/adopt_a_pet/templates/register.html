{% extends 'base.html' %}{% block content %}<section class="auth"><h1>Create your account</h1>{% if error %}<p class="form-error" role="alert">{{error}}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name<input name="name" maxlength="80" required></label><label>Email<input type="email" name="email" maxlength="120" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button>Sign Up</button></form></section>{% endblock %}
