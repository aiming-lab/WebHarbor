{% extends 'base.html' %}
{% block title %}Register · YouTube{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create account</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    <label>Display name {{ form.display_name() }}</label>
    <label>Handle {{ form.handle() }}</label>
    <label>Email {{ form.email() }}</label>
    <label>Password {{ form.password() }}</label>
    <label>Confirm password {{ form.confirm_password() }}</label>
    <button type="submit">Create account</button>
  </form>
</div>
{% endblock %}
