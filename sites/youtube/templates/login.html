{% extends 'base.html' %}
{% block title %}Sign in · YouTube{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Sign in</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    <label>Email {{ form.email() }}</label>
    <label>Password {{ form.password() }}</label>
    <button type="submit">Sign in</button>
  </form>
  <p><a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
