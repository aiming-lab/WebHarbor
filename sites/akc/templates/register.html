{% extends "base.html" %}
{% block title %}Create Profile{% endblock %}
{% block content %}
<section class="auth-panel">
  <form method="post">
    <h1>Create AKC Profile</h1>
    <label>Name <input name="display_name" required></label>
    <label>Username <input name="username" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Password <input name="password" type="password" minlength="8" required></label>
    <label>Household <select name="household">{% for item in household_options %}<option>{{ item }}</option>{% endfor %}</select></label>
    <label>Activity level <select name="activity_level">{% for item in activity_options %}<option>{{ item }}</option>{% endfor %}</select></label>
    <label>Experience <select name="experience">{% for item in experience_options %}<option>{{ item }}</option>{% endfor %}</select></label>
    <button type="submit">Create Profile</button>
  </form>
</section>
{% endblock %}
