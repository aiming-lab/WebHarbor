<article class="breed-card">
  <a class="breed-art" href="{{ url_for('breed_detail', slug=breed.slug) }}">
    <img src="{{ url_for('static', filename='images/breeds/' ~ breed.slug ~ '.jpg') }}" alt="{{ breed.name }}" loading="lazy">
  </a>
  <div class="breed-card-body">
    <h3><a href="{{ url_for('breed_detail', slug=breed.slug) }}">{{ breed.name }}</a></h3>
    <p>{{ breed.temperament }}. {{ breed.size }} {{ breed.group|lower }} breed.</p>
    <span class="card-link">Compare breed →</span>
  </div>
</article>
