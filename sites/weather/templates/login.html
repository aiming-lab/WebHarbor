{% extends 'base.html' %}
{% block title %}Sign in · Weather{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Sign in</h1>
  <form method="post">
    {{ form.hidden_tag() }}
    <label>Email {{ form.email() }}</label>
    <label>Password {{ form.password() }}</label>
    <button type="submit">Sign in</button>
  </form>
  <p>Use alice.j@test.com / TestPass123! for benchmark flows.</p>
</div>
{% endblock %}
