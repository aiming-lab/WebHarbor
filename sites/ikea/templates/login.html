{% extends "base.html" %}
{% block title %}Sign in - IKEA demo{% endblock %}
{% block content %}
<section class="auth-layout">
  <form class="form-panel" method="post">
    <p class="eyebrow">Account access</p>
    <h1>Sign in</h1>
    <label>Email
      <input type="email" name="email" autocomplete="username" required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
  <aside class="summary-card">
    <h2>New here?</h2>
    <p>Create a local account to use shopping lists, comparison, cart, and checkout.</p>
    <a href="{{ url_for('register') }}">Create a local account</a>
  </aside>
</section>
{% endblock %}
