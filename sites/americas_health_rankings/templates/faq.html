{% extends 'base.html' %}
{% block title %}Frequently Asked Questions{% endblock %}
{% block content %}
<div class="container" style="max-width:860px;padding-bottom:60px">
  <div class="page-head">
    <h1>Frequently Asked Questions</h1>
  </div>
  {% for f in items %}
  <details class="accordion">
    <summary>{{ f.question }}</summary>
    <div class="acc-body">{{ f.answer_html | safe }}</div>
  </details>
  {% endfor %}
</div>
{% endblock %}
