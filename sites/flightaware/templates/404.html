{% extends "base.html" %}
{% block title %}Page Not Found - FlightAware{% endblock %}
{% block content %}
<div class="login-note">
  The page you requested could not be found. Return to the <a href="/live/">live flight tracker</a>,
  or search for a flight, tail, airport, or city.
</div>
<div class="panel">
  <div class="panel-head">Search</div>
  <div class="panel-body">
    <form action="/live/form.rvt" method="get">
      <div class="form-row"><label>Flight number, tail, airport, or city</label><input type="text" name="query"></div>
      <button class="btn-primary" type="submit">Search</button>
    </form>
  </div>
</div>
{% endblock %}
