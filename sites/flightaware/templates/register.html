{% extends "base.html" %}
{% block title %}Join FlightAware{% endblock %}
{% block content %}
<div class="auth-box">
  <div class="panel">
    <div class="panel-head">Join FlightAware (free)</div>
    <div class="panel-body">
      <form method="post" action="{{ url_for('register') }}">
        <div class="form-row"><label>Username</label><input type="text" name="username" value="{{ request.form.get('username','') }}"></div>
        <div class="form-row"><label>Email</label><input type="text" name="email" value="{{ request.form.get('email','') }}"></div>
        <div class="form-row"><label>Password (8+ characters)</label><input type="password" name="password"></div>
        <button class="btn-primary" type="submit">Register</button>
      </form>
      <div class="note">Already a member? <a href="{{ url_for('login') }}">Login</a></div>
      <div class="note">FlightAware provides accurate real-time, historical and predictive flight insights to all segments of the aviation industry.</div>
    </div>
  </div>
</div>
{% endblock %}
