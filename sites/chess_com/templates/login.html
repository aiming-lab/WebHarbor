{% extends "base.html" %}
{% block content %}
<div class="form-card card">
  <h1 style="font-size:24px; text-align:center;">Log In</h1>
  <p class="muted small" style="text-align:center;">Welcome back! Log in to your account.</p>
  <form method="post">
    <div class="field">
      <label for="username">Username or Email</label>
      <input id="username" name="username" type="text" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
    </div>
    <button class="btn btn-primary btn-block" style="width:100%;" type="submit">Log In</button>
  </form>
  <p class="muted small" style="text-align:center; margin-top:14px;">
    New here? <a href="{{ url_for('register') }}">Sign Up</a>
  </p>
  <p class="muted small" style="text-align:center;">
    Demo accounts: alice.j@test.com / bob.c@test.com / carol.d@test.com / david.k@test.com<br>Password: TestPass123!
  </p>
</div>
{% endblock %}
