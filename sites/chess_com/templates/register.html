{% extends "base.html" %}
{% block content %}
<div class="form-card card">
  <h1 style="font-size:24px; text-align:center;">Sign Up</h1>
  <p class="muted small" style="text-align:center;">Join 250+ million players — it's free!</p>
  <form method="post">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required minlength="3" maxlength="25">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
    </div>
    <div class="field">
      <label for="name">Full name <span class="muted">(optional)</span></label>
      <input id="name" name="name" type="text">
    </div>
    <div class="field">
      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="US">United States</option>
        <option value="GB">United Kingdom</option>
        <option value="IN">India</option>
        <option value="DE">Germany</option>
        <option value="FR">France</option>
        <option value="BR">Brazil</option>
        <option value="NO">Norway</option>
        <option value="RU">Russia</option>
        <option value="CA">Canada</option>
        <option value="AU">Australia</option>
      </select>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8">
    </div>
    <div class="field">
      <label for="confirm">Confirm password</label>
      <input id="confirm" name="confirm" type="password" required minlength="8">
    </div>
    <button class="btn btn-primary" style="width:100%;" type="submit">Sign Up</button>
  </form>
  <p class="muted small" style="text-align:center; margin-top:14px;">
    Already a member? <a href="{{ url_for('login') }}">Log In</a>
  </p>
</div>
{% endblock %}
