{% extends 'base.html' %}
{% block title %}All Specialties | Healthgrades{% endblock %}
{% block content %}
<div class="page-inner">
    <h1 class="page-title">All Specialties</h1>
    <div class="specialty-tiles specialty-tiles-full">
        {% for s in specialties %}
        <a href="{{ url_for('specialty_page', slug=s.slug) }}" class="specialty-tile">{{ s.name }}</a>
        {% endfor %}
    </div>
</div>
{% endblock %}
