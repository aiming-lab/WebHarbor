{% extends "base.html" %}
{% block title %}Sign In | Marriott Bonvoy{% endblock %}
{% block content %}
<div class="container auth-page">
  <div class="auth-card">
    <h1>Sign In</h1>
    <p class="auth-sub">Sign in with your Marriott Bonvoy® account to unlock member rates.</p>
    <form method="post" class="auth-form">
      <div class="field"><label for="email">Email address</label>
        <input id="email" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"></div>
      <button type="submit" class="btn-find btn-block">Sign In</button>
    </form>
    <p class="auth-alt">New to Marriott Bonvoy? <a href="/loyalty/createAccount/createAccountPage1.mi">Join now — it's free</a></p>
  </div>
</div>
{% endblock %}
