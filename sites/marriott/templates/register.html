{% extends "base.html" %}
{% block title %}Create Account | Marriott Bonvoy{% endblock %}
{% block content %}
<div class="container auth-page">
  <div class="auth-card auth-wide">
    <h1>Create Your Marriott Bonvoy® Account</h1>
    <p class="auth-sub">Membership is free. Earn and redeem points at participating hotels worldwide.</p>
    <form method="post" class="auth-form">
      <div class="form-row">
        <div class="field"><label for="first_name">First name</label>
          <input id="first_name" name="first_name" type="text" required></div>
        <div class="field"><label for="last_name">Last name</label>
          <input id="last_name" name="last_name" type="text" required></div>
      </div>
      <div class="field"><label for="email">Email address</label>
        <input id="email" name="email" type="email" required></div>
      <div class="form-row">
        <div class="field"><label for="password">Password (8+ characters)</label>
          <input id="password" name="password" type="password" required minlength="8"></div>
        <div class="field"><label for="confirm_password">Confirm password</label>
          <input id="confirm_password" name="confirm_password" type="password" required minlength="8"></div>
      </div>
      <button type="submit" class="btn-find btn-block">Create Account</button>
    </form>
    <p class="auth-alt">Already a member? <a href="/sign-in.mi">Sign in</a></p>
  </div>
</div>
{% endblock %}
